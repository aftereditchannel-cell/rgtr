name: Release — Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v1.2.0)'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '35'
  BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  setup-android:
    name: Setup Android SDK
    runs-on: ubuntu-latest
    
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
          key: android-sdk-${{ env.ANDROID_SDK_VERSION }}
          restore-keys: |
            android-sdk-

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: setup-android
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create keystore for release signing
        run: |
          mkdir -p android/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/nexus-hq.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          fi

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x gradlew
          if [ -f keystore/nexus-hq.jks ]; then
            ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Find built APK
        id: find-apk
        run: |
          $FILE = Get-ChildItem -Path android -Recurse -Include *.apk | Select-Object -First 1
          if ($FILE) {
            Write-Output "APK_FOUND=$($FILE.FullName)"
          }

      - name: Upload APK to Release
        if: steps.find-apk.outputs.APK_FOUND != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.find-apk.outputs.APK_FOUND }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        continue-on-error: true

      - name: Upload all artifacts (fallback)
        if: steps.find-apk.outputs.APK_FOUND == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/**/*.apk
          retention-days: 7
